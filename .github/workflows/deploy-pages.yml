name: Deploy Mi Compra 3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SOURCE_1: https://mi-compra-3-bq1f0r100-yo-2fd0.vercel.app
  SOURCE_2: https://mi-compra-3-h4iz3rs7d-yo-2fd0.vercel.app
  SOURCE_3: https://mi-compra-3-yo-2fd0.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Recover working app and apply corrected logos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, re, urllib.request, sys

          wf = pathlib.Path('.github/workflows/build-from-vercel.yml').read_text(encoding='utf-8')
          def env_value(name):
              m = re.search(r'^\s*'+re.escape(name)+r':\s*["\']?([^"\'\n]+)', wf, re.M)
              if not m:
                  raise RuntimeError(f'No se encontró {name} en el workflow de recuperación')
              return m.group(1).strip()

          alcampo = env_value('ALCAMPO_B64')
          ahorramas = env_value('AHORRAMAS_B64')

          urls = [
              'https://mi-compra-3-bq1f0r100-yo-2fd0.vercel.app',
              'https://mi-compra-3-h4iz3rs7d-yo-2fd0.vercel.app',
              'https://mi-compra-3-yo-2fd0.vercel.app',
          ]
          html = None
          chosen = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read()
                      if r.status == 200 and b'<html' in data.lower():
                          html = data.decode('utf-8')
                          chosen = url
                          break
              except Exception as e:
                  print('No disponible:', url, repr(e))
          if html is None:
              raise RuntimeError('Ninguna URL de la Mi Compra 3 funcional está disponible para recuperación')
          print('Recuperada desde:', chosen)

          def replace_logo(text, key, b64):
              uri = 'data:image/webp;base64,' + b64
              # Mi Compra 3 guarda los logos en el objeto JS const logos={...}.
              patterns = [
                  rf'(["\']{re.escape(key)}["\']\s*:\s*)["\'][^"\']*["\']',
                  rf'({re.escape(key)}\s*:\s*)["\'][^"\']*["\']',
              ]
              for p in patterns:
                  new, n = re.subn(p, lambda m: m.group(1)+repr(uri), text, count=1)
                  if n:
                      return new
              raise RuntimeError(f'No se pudo localizar el logo {key}')

          html = replace_logo(html, 'Alcampo', alcampo)
          html = replace_logo(html, 'Ahorramas', ahorramas)
          pathlib.Path('index.html').write_text(html, encoding='utf-8')
          pathlib.Path('.nojekyll').write_text('', encoding='utf-8')
          print('index.html generado:', len(html), 'caracteres')
          PY

      - name: Commit recovered static app
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish Mi Compra 3 with corrected supermarket logos"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
